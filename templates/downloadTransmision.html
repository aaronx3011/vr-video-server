<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const SERVER_IP = "{{SERVER_IP}}"
        const SERVER_PORT = "5000"
    </script>
    <title>Download </title>
    <style>
        /* Estilos para el scrollbar */
        #image-preview-container {
            max-height: 300px; /* Ajuste la altura máxima para activar el scroll */
            overflow-y: auto;
        }

        #image-preview-container::-webkit-scrollbar {
            width: 10px;
            border-radius: 10px;
        }

        #image-preview-container::-webkit-scrollbar-thumb {
            background-color: #313131; /* Color gris */
            border-radius: 10px;
        }

        #image-preview-container::-webkit-scrollbar-track {
            background: #2b2b2b60; /* Color gris oscuro de fondo */
        }
    </style>
</head>

<body class="bg-[#2d2d2d] flex flex-col gap-10 justify-center items-center h-screen">
    <header>
        <img src="{{ url_for('static',filename='img/VRINSITU_Vertical_Blanco.png') }}" class="w-[200px]  mr-auto" alt="">
    </header>
    <div class="bg-[#474747] p-6 rounded-lg shadow-lg max-w-3xl w-full">
        <h2 class="text-xl font-semibold text-gray-200 mb-4">Download Files</h2>
        <hr>
        <br>
        <h4 class="text-m text-gray-200 mb-4">Select Folder</h4>
        <select id="directories-dropdown" onchange="getObjectsInDirectory()"
            class="directories-dropdown test-select p-2 w-full bg-transparent border border-gray-200 text-white rounded"></select>


        <br>
        <br>
        <h4 class="text-m text-gray-200 mb-4">Select Files</h4>
        <select id="files-dropdown"
            class="files-dropdown test-select p-2 w-full bg-transparent border border-gray-200 text-white rounded"></select>

        <!-- Estado de procesamiento de AWS -->
        <div id="ffmpeg-output" class="container-output mb-4">
            <span id="ffmpeg-text" class="text-white"></span>
        </div>

        <!-- Contenedor de previsualización de imágenes -->
        <div id="image-preview-container" class="grid grid-cols-2 gap-4 mb-4 hidden max-h-[500px]  overflow-x-hidden overflow-auto px-5 "></div>

            <!-- Botón de enviar -->
            <div id="upload-buttons" class="flex items-center justify-between">
                <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-500" onclick="downloadFilesFromAWS()">
                    Download selected playlist
                </button>
            </div>

            <div id="loading-text" class="hidden text-gray-300">
                Uploading and processing images... Please wait.
            </div>
        </form>
    </div>

    <!-- Referencia al archivo externo de JavaScript -->
    <script src="{{url_for('static', filename='downloadTransmision.js')}}"></script>

</body>

</html>
