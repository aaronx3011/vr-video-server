    <style>
        input::placeholder {
            font-size: small;
            text-align: start;
            font-weight: 400;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 2px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

<body class="VRINSITU bg-[#2d2d2d] ">
    <section class="bg-[#2d2d2d] flex flex-col justify-center p-4 pt-[8rem] xl:pt-4 xl:p-4 xl:pl-[16rem] pl-4 w-full gap-5 relative">

            <header class="flex justify-between">

            </header>

            <h1 class="font-bold">Opciones Avanzadas</h1>
            <div class="flex flex-row flex-wrap gap-5">


                <button onclick="stitcherStop()"

                    <span>Stop stitching</span> </button>
                <button onclick="observerStop()"

                <button onclick="clearBucketS3()"

                    <span>Clear Bucket</span> </button>
                <button onclick="clearFolder()"
                    class="secundary-button w-full border-2 border-white/60 hover:bg-white/50 transition duration-300 ease-in-out p-1 rounded">
                    <span>Clear Folder</span> </button>

                <a href="http://{{SERVER_IP}}:${SERVER_PORT}/file/upload/"
                        class="text-center secundary-button w-full border-2 border-white/60 hover:bg-white/50 transition duration-300 ease-in-out p-1 rounded">

                </a>
                

                <a href="http://{{SERVER_IP}}:${SERVER_PORT}/publicidad/"

                </a>

                <button onclick="backupBucket()" id="backup-bucket-button"

                <a href="http://{{SERVER_IP}}:${SERVER_PORT}/bucket/download/transmision/"

                                </svg>
                                <span id="file-name" class="mt-2 text-sm text-gray-200">Click to upload</span>

                    <div id="main-status-div" class="container-main-status flex  flex-col   justify-start gap-7 px-5">
                        <div id="resources-div" class="container-resources ">
                            <ul id="resources" class="flex gap-15 justify-center text-center">
                                <li>
                                    <label for="cpu"> CPU [%]: </label>
                                    <span id="cpu" class="font-normal"> 0% </span>
                                </li>
                                <li>

    <script>


        function displayFileName() {
            var input = document.getElementById('template-input');
            var fileName = input.files[0].name;
            document.getElementById('file-name').textContent = fileName;
        }
    </script>
