<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const SERVER_IP = "{{SERVER_IP}}"
    </script>
    <title>Upload Multiple Images</title>
    <style>
        /* Estilos para el scrollbar */
        #image-preview-container {
            max-height: 300px; /* Ajuste la altura máxima para activar el scroll */
            overflow-y: auto;
        }

        #image-preview-container::-webkit-scrollbar {
            width: 10px;
            border-radius: 10px;
        }

        #image-preview-container::-webkit-scrollbar-thumb {
            background-color: #313131; /* Color gris */
            border-radius: 10px;
        }

        #image-preview-container::-webkit-scrollbar-track {
            background: #2b2b2b60; /* Color gris oscuro de fondo */
        }
    </style>
</head>

<body class="bg-[#2d2d2d] flex flex-col gap-10 justify-center items-center h-screen">
    <header>
        <img src="{{ url_for('static',filename='img/VRINSITU_Vertical_Blanco.png') }}" class="w-[200px]  mr-auto" alt="">
    </header>
    <div class="bg-[#474747] p-6 rounded-lg shadow-lg max-w-3xl w-full">
        <h2 class="text-xl font-semibold text-gray-200 mb-4">Upload Multiple Images</h2>

        <!-- Estado de procesamiento de AWS -->
        <div id="ffmpeg-output" class="container-output mb-4">
            <span id="ffmpeg-text" class="text-white"></span>
        </div>

        <!-- Contenedor de previsualización de imágenes -->
        <div id="image-preview-container" class="grid grid-cols-2 gap-4 mb-4 hidden max-h-[500px]  overflow-x-hidden overflow-auto px-5 "></div>

        <!-- Formulario para subir imágenes -->
        <form id="upload-form" method="post" enctype="multipart/form-data" action="/file/upload/" class="space-y-4" onsubmit="handleFormSubmit(event)">
            <div id="drag-area" class="drag-area flex justify-center items-center bg-gray-700 p-4 rounded-lg border border-dashed border-gray-500">
                <input id="template-input" type="file" name="file" accept="image/*" multiple class="hidden">
                <label for="template-input" class="cursor-pointer text-gray-400 hover:text-gray-300 flex flex-col items-center">
                    <svg xmlns="https://www.w3.org/2000/svg" class="h-12 w-12 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-upload"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span class="text-lg">Drag & Drop or Click to Upload Multiple Images</span>
                </label>
            </div>

            <!-- Botón de enviar -->
            <div id="upload-buttons" class="flex items-center justify-between hidden">
                <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-500">
                    Upload Images
                </button>
            </div>

            <div id="loading-text" class="hidden text-gray-300">
                Uploading and processing images... Please wait.
            </div>
        </form>
    </div>

    <!-- Referencia al archivo externo de JavaScript -->
    <script src="{{url_for('static', filename='uploadFile.js')}}"></script>

</body>

</html>
